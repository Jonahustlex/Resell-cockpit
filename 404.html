<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#070809">
<title>Seite nicht gefunden · Resell Cockpit</title>
<style>
:root{--bg:#070809;--card:#101215;--line:#262A30;--ink:#EDEEF0;--ink-2:#A3A9B2;--green:#2FC4CD;--green-2:#007782;--green-ink:#021416;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(600px 300px at 50% 0%,rgba(47,196,205,.12),transparent),var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{width:100%;max-width:420px;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px 24px}
.logo{width:44px;height:44px;margin:0 auto 18px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,var(--green),var(--green-2));color:var(--green-ink);font-weight:800;font-size:15px;box-shadow:0 0 22px -4px rgba(47,196,205,.6)}
.code{font:600 56px/1 ui-monospace,"SF Mono",Consolas,monospace;letter-spacing:-.03em;color:var(--green);margin:0 0 6px}
h1{font-size:20px;margin:0 0 8px}
p{color:var(--ink-2);margin:0 0 22px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:10px 20px;border-radius:12px;background:var(--green);color:var(--green-ink);font-weight:600;text-decoration:none}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="logo" aria-hidden="true">RC</div>
  <p class="code" aria-hidden="true">404</p>
  <h1>Diese Seite gibt es nicht</h1>
  <p>Vielleicht hast du dich bei der Adresse vertippt.</p>
  <a href="/Resell-cockpit/">Zum Resell Cockpit</a>
</main>
</body>
</html>
